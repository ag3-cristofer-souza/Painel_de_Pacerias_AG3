# Incluído em cada `location`: no nginx, `add_header` dentro de um location anula os herdados do server.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), payment=(), camera=(), microphone=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
# Painel interno de parceiros: fora dos buscadores (o index.html também tem <meta name="robots">).
add_header X-Robots-Tag "noindex, nofollow" always;
# Só a API. Quando os chamados usarem o tempo real (onda 5), acrescentar wss://api.ag3system.com em connect-src.
# Domínio próprio de parceiro (D18) exige rever esta lista.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https:; connect-src 'self' https://api.ag3system.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
